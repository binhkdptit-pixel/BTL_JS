<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - BBT đồ ăn nhanh</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <h1>Đăng Ký</h1>
    <form id="registerForm">
        <input type="text" id="regUsername" placeholder="Tên đăng nhập" required><br><br>
        <input type="password" id="regPassword" placeholder="Mật khẩu" required><br><br>
        <button type="submit">Đăng Ký</button>
    </form>
    <p><a href="login.html">Đã có tài khoản? Đăng nhập</a></p>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const username = document.getElementById("regUsername").value;
            const password = document.getElementById("regPassword").value;
            registerUser(username, password);
        });
    </script>
</body>
</html>
