<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - BBT đồ ăn nhanh</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h2 class="brand">BBT - Đồ Ăn Nhanh</h2>
        <p class="tagline">Thức ăn ngon, nhanh chóng, giá tốt</p>
    </div>
    
    <h1>Login to BBT</h1>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Tên đăng nhập" required><br><br>
        <input type="password" id="password" placeholder="Mật khẩu" required><br><br>
        <button type="submit">Đăng Nhập</button>
    </form>
    <p><a href="register.html">Chưa có tài khoản? Đăng ký</a></p>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            loginUser(username, password);
        });
    </script>
</body>
</html>
