<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ Hàng - BBT Quán Ăn Việt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/cart.css" />
  </head>
  <body class="cart-page">
    <header class="cart-header">
      <a class="brand" href="index.html">
        <img src="assets/images/logo.png" alt="Logo BBT" style="height: 40px; vertical-align: middle;">
      </a>
      <nav aria-label="Điều hướng">
        <a href="index.html">Trang chủ</a>
        <a href="products.html">Thực đơn</a>
        <a href="cart.html" class="active"
          >Giỏ hàng <span class="cart-badge" id="cartCount">0</span></a
        >
      </nav>
    </header>

    <!-- Giỏ hàng -->
    <main class="cart-main">
      <div class="cart-title">
        <h1>Giỏ hàng của bạn</h1>
        <p>Kiểm tra món ăn trước khi thanh toán</p>
      </div>

      <!-- Danh sách món trong giỏ hàng -->
      <section class="cart-card" aria-label="Danh sách món trong giỏ">
        <div class="cart-card-head">
          <h2>Đơn hàng tạm</h2>
          <span id="cartItemLabel">0 món</span>
        </div>

        <!-- Các món ăn sẽ được thêm vào đây bằng JavaScript -->
        <div id="cartItems"></div>

        <!-- Tổng kết đơn hàng -->
        <div class="cart-summary" id="cartSummary">
          <div class="summary-row">
            <span>Số lượng món</span>
            <strong id="summaryCount">0</strong>
          </div>

          <!-- Tổng giá tiền -->
          <div class="summary-row total">
            <span>Tổng thanh toán</span>
            <strong id="totalPrice">0đ</strong>
          </div>

          <!-- Nút thanh toán -->
          <div class="cart-actions">
            <a class="btn-back-menu" href="products.html">← Tiếp tục mua sắm</a>
            <button class="btn-checkout" type="button" onclick="checkout()">
              Thanh toán &amp; xuất hóa đơn
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="cart-footer">
      <p>&copy; 2026 <strong>BBT Fast Food</strong>. All rights reserved.</p>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
